[project]
name = "wp-migration-verifier"
version = "0.1.0"
description = "Verify WordPress migrations by comparing file inventories and hashes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
]
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wp_migration_verifier*"]